#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    sensitivity = 0.4 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.7
    }
}

# --- Trackpad gestures (Hyprland 0.51+) ---
# Gestures wiki page - https://wiki.hypr.land/Configuring/Gestures/
# 3-finger horizontal swipe to switch workspaces (old: gestures.workspace_swipe[_fingers])
gesture = 3, horizontal, workspace
# (Examples of other possibilities you can add:)
# gesture = 3, up, fullscreen
# gesture = 3, down, close
# gesture = 4, horizontal, workspace   # 4-finger variant if you prefer

# Per-device tweaks
device {
    name = "Razer Razer DeathAdder V2 Pro"
    sensitivity = -0.5
}
